# Prometheus scrape configuration for the appointment platform.
# The API serves /metrics only when METRICS_TOKEN is set; the same token goes in metrics_token below.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: appointment-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["backend:8000"]
