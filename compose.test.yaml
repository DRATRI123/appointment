# Automated tests in Docker against a real, throw-away PostgreSQL (the database lives in memory and disappears).
#
#   docker compose -f compose.yaml -f compose.test.yaml run --rm backend-tests
#   docker compose -f compose.yaml -f compose.test.yaml down -v
#
# The test container has no internet access (internal network only): no real message, payment or webhook can leave.
# Uses its own project name, so it never touches development or production data.

name: appointment-test

services:
  backend-tests:
    image: appointment-api:dev
    build:
      context: ./backend
      dockerfile: ../deployment/docker/Dockerfile.backend
      target: dev
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    env_file:
      - path: .env.test.example
        required: true
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://app:test-only-password@postgres:5432/appointments
      TEST_DATABASE_URL: postgresql+psycopg://app:test-only-password@postgres:5432/app_test
      PGPASSWORD: test-only-password
      RUFF_CACHE_DIR: /tmp/ruff
      STORAGE_LOCAL_PATH: /tmp/uploads
      BACKUP_DIR: /tmp/backups
    command:
      - sh
      - -c
      - >-
        ruff check app tests
        && alembic upgrade head && alembic check
        && python -m pytest -q -p no:cacheprovider
    working_dir: /repo/backend
    volumes:
      - .:/repo:ro                   # read-only: the tests cannot change your code (some read templates and docs)
    tmpfs: ["/tmp:size=512m,mode=1777"]
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}

  postgres:
    environment:
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: appointments
    volumes: !override
      - ./deployment/docker/test-databases.sql:/docker-entrypoint-initdb.d/test-databases.sql:ro
    tmpfs:
      - /var/lib/postgresql/data:size=1g,uid=70,gid=70,mode=0700
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=200"]

  # The app services are not needed for the tests: `run backend-tests` starts only PostgreSQL.
  api: {profiles: ["app"]}
  worker: {profiles: ["app"]}
  migrate: {profiles: ["app"]}
  web: {profiles: ["app"]}
