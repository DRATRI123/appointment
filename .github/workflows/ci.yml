name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Real servers for the backup round trip (pg_dump/pg_restore) and the shared API-key rate limit.
      postgres:
        image: postgres:16-alpine   # matches the runner's PostgreSQL 16 client tools
        env: {POSTGRES_USER: app, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: backup_test}
        # extra databases (app_test, migrations_check, *_race, *_migrate) are created by the steps and tests
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Security lint (bandit)
        run: bandit -q -r app
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Migrations apply cleanly and match the models (SQLite)
        run: alembic upgrade head && alembic check
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./data/ci.db
      - name: Migrations apply cleanly, match the models and roll back (PostgreSQL)
        run: |
          PGPASSWORD=ci-only-password psql -h 127.0.0.1 -U app -d backup_test -c "CREATE DATABASE migrations_check" -c "CREATE DATABASE app_test"
          alembic upgrade head && alembic check
          alembic downgrade base && alembic upgrade head
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://app:ci-only-password@127.0.0.1:5432/migrations_check
      - name: Tests with coverage
        run: python -m pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=88
        env:
          APP_ENV: test
          TEST_POSTGRES_URL: postgresql+psycopg://app:ci-only-password@127.0.0.1:5432/backup_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
      - name: Whole suite on PostgreSQL (concurrency races, data migration, dialect differences)
        run: python -m pytest
        env:
          APP_ENV: test
          TEST_DATABASE_URL: postgresql+psycopg://app:ci-only-password@127.0.0.1:5432/app_test
          TEST_POSTGRES_URL: postgresql+psycopg://app:ci-only-password@127.0.0.1:5432/backup_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/0

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency vulnerabilities (npm audit)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - run: npm run build

  e2e:
    # Full browser run against real servers: booking, payments, refunds, accessibility (axe) and CSP checks.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      APP_ENV: development          # console OTP provider returns debug codes the tests read
      RATE_LIMIT_ENABLED: "false"
      DATABASE_URL: sqlite:///./data/e2e.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python ../scripts/seed.py
          PLATFORM_ADMIN_PASSWORD=ci-only-Admin-pass1 python ../scripts/create_platform_admin.py --email root@example.com
          nohup uvicorn app.main:app --port 8000 > ../uvicorn.log 2>&1 &
          nohup python -m app.workers.runner --interval 10 > ../worker.log 2>&1 &
      - name: Build and start web
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm run start -- --port 3000 > ../next.log 2>&1 &
          npx --yes wait-on@8 -t 60000 http://127.0.0.1:8000/api/v1/health http://127.0.0.1:3000/login
      - name: Playwright
        working-directory: frontend
        run: npx playwright test --trace off --workers 1
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          E2E_PLATFORM_ADMIN_EMAIL: root@example.com
          E2E_PLATFORM_ADMIN_PASSWORD: ci-only-Admin-pass1
      - name: Server logs
        if: failure()
        run: tail -n 200 uvicorn.log worker.log next.log

  docker:
    # The production images build, the stack configuration is valid, and the alert rules parse.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.backend -t appointment-api:ci backend
      - name: Build web image
        run: docker build -f infrastructure/docker/Dockerfile.frontend -t appointment-web:ci frontend
      - name: Images contain no secrets or local data
        run: |
          docker run --rm appointment-api:ci sh -c 'test ! -e /app/.env && test ! -e /app/data && test ! -e /app/uploads && command -v pg_dump && id -u | grep -qv "^0$"'
      - name: Compose file is valid with a generated .env
        run: |
          python3 scripts/generate_env.py --domain ci.example.com
          docker compose config --quiet
          docker compose --profile monitoring config --quiet
          rm .env
      - name: Prometheus config and alert rules
        run: |
          echo dummy-token-for-validation > /tmp/metrics_token
          docker run --rm --entrypoint promtool -v "$PWD/infrastructure/monitoring:/etc/prometheus:ro" \
            -v /tmp/metrics_token:/run/secrets/metrics_token:ro prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
