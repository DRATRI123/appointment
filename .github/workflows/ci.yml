name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Security lint (bandit)
        run: bandit -q -r app
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Migrations apply cleanly
        run: alembic upgrade head
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./data/ci.db
      - name: Tests with coverage
        run: python -m pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=88
        env:
          APP_ENV: test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency vulnerabilities (npm audit)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - run: npm run build

  e2e:
    # Full browser run against real servers: booking, payments, refunds, accessibility (axe) and CSP checks.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      APP_ENV: development          # console OTP provider returns debug codes the tests read
      RATE_LIMIT_ENABLED: "false"
      DATABASE_URL: sqlite:///./data/e2e.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python ../scripts/seed.py
          nohup uvicorn app.main:app --port 8000 > ../uvicorn.log 2>&1 &
      - name: Build and start web
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm run start -- --port 3000 > ../next.log 2>&1 &
          npx --yes wait-on@8 -t 60000 http://127.0.0.1:8000/api/v1/health http://127.0.0.1:3000/login
      - name: Playwright
        working-directory: frontend
        run: npx playwright test --trace off --workers 1
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - name: Server logs
        if: failure()
        run: tail -n 200 uvicorn.log next.log
