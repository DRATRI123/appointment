# Shared settings for every proxied location.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Nginx is the edge: it REPLACES any X-Forwarded-For a client sent with the real peer address, so nobody can fake
# their IP to dodge rate limits or pollute the audit log. The API trusts these headers only from the Docker network
# (FORWARDED_ALLOW_IPS). Behind Cloudflare or a load balancer, add set_real_ip_from for their ranges first.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
# A failed connection is retried once, and only for safe requests (GET/HEAD): a booking POST is never sent twice.
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
