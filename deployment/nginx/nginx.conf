# Nginx: the only container with public ports (80 and 443 on the server -> 8080 and 8443 inside; it runs as the
# unprivileged "nginx" user, so it cannot bind ports below 1024 itself). It terminates HTTPS and routes:
#   /api/*, /media/*, /docs, /redoc  -> api:8000      everything else -> web:3000      /metrics -> never (404)
# Per-site settings are in templates/ (filled in with DOMAIN at start); shared proxy settings in snippets/.
# All of this is baked into the appointment-nginx image (deployment/docker/Dockerfile.nginx) for each release.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    # Writable paths live on a tmpfs (the container's filesystem is read-only).
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    server_tokens off;           # no version number in headers or error pages
    sendfile on;
    tcp_nopush on;
    port_in_redirect off;        # redirects never mention the internal 8080/8443

    # Slow-client protection (slowloris) and request size limits. Uploads are at most MAX_UPLOAD_SIZE_MB (5 MB) in the
    # app; 12 MB leaves room for the multipart wrapper.
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;
    keepalive_timeout     65s;
    keepalive_requests    1000;
    reset_timedout_connection on;
    client_max_body_size  12m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # Access log: one JSON line per request. Only the path is logged, never the query string ($uri, not
    # $request_uri), cookies or Authorization headers, so tokens and codes in URLs never reach the logs.
    log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                                '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,'
                                '"upstream_seconds":"$upstream_response_time","host":"$host","agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Rate limits per client IP: a first line of defence in front of the API's own limits (which stay in force).
    #   per_ip   every request; generous (a clinic's front desk may share one IP between several staff)
    #   sign_in  POSTs to sign-in, one-time-code, password and booking-verification endpoints only
    map $request_method $sign_in_key {
        POST    $binary_remote_addr;
        default "";              # an empty key is never limited: GET /auth/me on every page load is unaffected
    }
    limit_req_zone  $binary_remote_addr zone=per_ip:20m  rate=20r/s;
    limit_req_zone  $sign_in_key        zone=sign_in:10m rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Docker's internal DNS: containers get new addresses when they are recreated (updates); "resolve" below
    # follows them without restarting Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream api {
        zone api 64k;
        server api:8000 resolve;
        keepalive 32;
    }
    upstream web {
        zone web 64k;
        server web:3000 resolve;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
